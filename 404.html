<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found — Veeramuthu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--blue-deep:#0B2545;
--blue-mid:#123B6B;
--line-cyan:#7EC8E3;
--paper:#EAF4FB;
--paper-dim:#9FC3DC;
}
*{box-sizing:border-box;}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:var(--blue-deep);
color:var(--paper);
font-family:'IBM Plex Mono',monospace;
background-image:
linear-gradient(var(--blue-mid) 1px, transparent 1px),
linear-gradient(90deg, var(--blue-mid) 1px, transparent 1px);
background-size:28px 28px;
text-align:center;
padding:24px;
}
h1{font-family:'Space Mono',monospace;font-size:clamp(48px,10vw,96px);margin:0 0 8px;color:var(--line-cyan);}
p{color:var(--paper-dim);font-size:15px;margin:0 0 28px;}
.btn{
display:inline-block;
font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-decoration:none;
padding:10px 22px;border-radius:3px;letter-spacing:.03em;
background:var(--line-cyan);color:var(--blue-deep);
}
</style>
</head>
<body>
<div>
<h1>404</h1>
